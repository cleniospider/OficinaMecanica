<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Repair - Sistema</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="container-central">
        
        <div class="logo-area">
            <img src="img/download.png" alt="Logo Auto Repair">
        </div>

        <div class="forms-area">
            
            <div id="login-screen">
                <h1 class="title">LOGIN</h1>

                <form id="form-login" action="admin.html">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" placeholder="email@gmail.com" required>
                    </div>

                    <div class="form-group">
                        <label for="login-senha">Senha</label>
                        <input type="password" id="login-senha" placeholder="******" minlength="6" maxlength="10" required>
                    </div>

                    <div class="roles-container">
                        <input type="radio" id="login-admin" name="login-cargo" value="admin" required>
                        <label for="login-admin">ADMIN</label>

                        <input type="radio" id="login-recep" name="login-cargo" value="recep">
                        <label for="login-recep">RECEP.</label>

                        <input type="radio" id="login-mecan" name="login-cargo" value="mecan">
                        <label for="login-mecan">MECÂN.</label>
                    </div>

                    <div class="link-container">
                        não possui uma conta? <a id="link-ir-cadastro" style="cursor: pointer;">Cadastrar - se</a>
                    </div>

                    <button type="submit" class="btn-submit">Entrar</button>
                </form>
            </div>

            <div id="register-screen" class="hidden">
                <h1 class="title title-register">CADASTRO PROFISSIONAL</h1>

                <form id="form-register" action="admin.html">
                    <div class="form-row">
                        <div class="form-group half-width">
                            <label for="reg-nome">Nome Completo</label>
                            <input type="text" id="reg-nome" placeholder="Tássio" required>
                        </div>
                        <div class="form-group half-width">
                            <label for="reg-email">Email</label>
                            <input type="email" id="reg-email" placeholder="email@gmail.com" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group half-width">
                            <label for="reg-cpf">CPF</label>
                            <input type="text" id="reg-cpf" placeholder="000.000.000-00" maxlength="14" required>
                        </div>
                        <div class="form-group half-width">
                            <label for="reg-tel">Telefone</label>
                            <input type="text" id="reg-tel" placeholder="(00) 00000-0000" maxlength="15" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group half-width">
                            <label for="reg-senha">Senha</label>
                            <input type="password" id="reg-senha" placeholder="******" minlength="6" maxlength="10" required>
                        </div>
                        <div class="form-group half-width">
                            <label for="reg-confirma-senha">Confirmação de senha</label>
                            <input type="password" id="reg-confirma-senha" placeholder="******" minlength="6" maxlength="10" required>
                        </div>
                    </div>

                    <label class="label-cargo">Cargo</label>
                    <div class="roles-container roles-register">
                        <input type="radio" id="reg-admin" name="reg-cargo" value="admin" required>
                        <label for="reg-admin">ADMIN</label>

                        <input type="radio" id="reg-recep" name="reg-cargo" value="recep">
                        <label for="reg-recep">RECEP.</label>

                        <input type="radio" id="reg-mecan" name="reg-cargo" value="mecan">
                        <label for="reg-mecan">MECÂN.</label>
                    </div>

                    <button type="submit" class="btn-submit">Cadastrar</button>

                    <div class="link-container link-back-container">
                        <a id="link-ir-login" style="cursor: pointer;">← Voltar para o Login</a>
                    </div>
                </form>
            </div>

        </div>
    </main>

    <script>
        // Lógica de alternância entre as telas de Login e Cadastro
const loginScreen = document.getElementById('login-screen');
const registerScreen = document.getElementById('register-screen');
const linkIrCadastro = document.getElementById('link-ir-cadastro');
const linkIrLogin = document.getElementById('link-ir-login');

linkIrCadastro.addEventListener('click', () => {
    loginScreen.classList.add('hidden');
    registerScreen.classList.remove('hidden');
});

linkIrLogin.addEventListener('click', () => {
    registerScreen.classList.add('hidden');
    loginScreen.classList.remove('hidden');
});

// LÓGICA DE REDIRECIONAMENTO POR CARGO NO LOGIN
const formLogin = document.getElementById('form-login');
formLogin.addEventListener('submit', (e) => {
    e.preventDefault(); // Impede o envio padrão do formulário
    
    // Pega o valor do cargo selecionado
    const cargoSelecionado = document.querySelector('input[name="login-cargo"]:checked').value;

    // Redireciona para a tela correspondente
    if (cargoSelecionado === 'admin') {
        window.location.href = 'admin.html';
    } else if (cargoSelecionado === 'recep') {
        window.location.href = 'recep.html';
    } else if (cargoSelecionado === 'mecan') {
        window.location.href = 'mecan.html';
    }
});

// LÓGICA DE REDIRECIONAMENTO NO CADASTRO (Opcional)
const formRegister = document.getElementById('form-register');
formRegister.addEventListener('submit', (e) => {
    e.preventDefault();
    const cargoCadastro = document.querySelector('input[name="reg-cargo"]:checked').value;
    
    if (cargoCadastro === 'admin') window.location.href = 'admin.html';
    if (cargoCadastro === 'recep') window.location.href = 'recep.html';
    if (cargoCadastro === 'mecan') window.location.href = 'mecan.html';
});

// Máscara do CPF (000.000.000-00)
const inputCpf = document.getElementById('reg-cpf');
inputCpf.addEventListener('input', (e) => {
    let value = e.target.value.replace(/\D/g, "");
    if (value.length > 3) value = value.slice(0, 3) + "." + value.slice(3);
    if (value.length > 7) value = value.slice(0, 7) + "." + value.slice(7);
    if (value.length > 11) value = value.slice(0, 11) + "-" + value.slice(11);
    e.target.value = value.slice(0, 14);
});

// Máscara do Telefone ((00) 00000-0000)
const inputTel = document.getElementById('reg-tel');
inputTel.addEventListener('input', (e) => {
    let value = e.target.value.replace(/\D/g, "");
    if (value.length > 0) value = "(" + value;
    if (value.length > 3) value = value.slice(0, 3) + ") " + value.slice(3);
    if (value.length > 10) value = value.slice(0, 10) + "-" + value.slice(10);
    e.target.value = value.slice(0, 15);
});
    </script>
</body>
</html>

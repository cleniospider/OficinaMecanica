<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Repair - Novo Veículo</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/ordens.css">
    <link rel="stylesheet" href="css/novo-veiculo.css">
</head>
<body>

    <header class="top-header">
        <button class="hamburger-btn">
            <span></span><span></span><span></span>
        </button>
        <div class="header-logo-text">AUTO REPAIR</div>
    </header>

    <aside class="sidebar" id="sidebar">
        <div class="profile-area">
            <img src="img/download.png" alt="Avatar" class="avatar"> 
            <div class="mobile-profile-text">
                AUTO REPAIR<br>
                <span class="role-text">ADMINISTRADOR</span>
            </div>
        </div>
        <ul class="nav-links">
            <li><a href="admin.html">Painel de Gestão</a></li>
            <li><a href="cadastrocliente.html">Cadastro Cliente</a></li>
            <li><a href="cadastroveiculo.html" class="active">Cadastro Veículo</a></li>
            <li><a href="ordens.html">Ordens de Serviços</a></li>
            <li><a href="estoque-critico.html">Estoque de Peças</a></li>
            <li><a href="historico-veiculos.html">Histórico de Veículos</a></li>
            <li><a href="#">Financeiro</a></li>
            <li><a href="#">Relatórios</a></li>
            <li><a style="cursor:pointer;">👤 Minha Conta</a></li>
            <li><a href="index.html" class="logout-link">Sair</a></li>
        </ul>
    </aside>
    <main class="main-content">
        <div class="orders-container">
            <div class="orders-header">
                <h2>Cadastrar Novo Veículo</h2>
            </div>

            <div class="caixa-formulario">
                <form action="cadastroveiculo.html" class="form-estilizado">
                    <div class="grupo-input">
                        <label for="marcas-veiculo">Marca do veículo:</label>
                                <select name="marcas" id="marcas-veiculo">
                                    <option value="">Selecione uma marca</option>
                                    <option value="Acura">Acura</option>
                                    <option value="Agrale">Agrale</option>
                                    <option value="Alfa Romeo">Alfa Romeo</option>
                                    <option value="Aston Martin">Aston Martin</option>
                                    <option value="Audi">Audi</option>
                                    <option value="BMW">BMW</option>
                                    <option value="BYD">BYD</option>
                                    <option value="CAOA Chery">CAOA Chery</option>
                                    <option value="Chevrolet">Chevrolet</option>
                                    <option value="Chrysler">Chrysler</option>
                                    <option value="Citroën">Citroën</option>
                                    <option value="Dodge">Dodge</option>
                                    <option value="Ferrari">Ferrari</option>
                                    <option value="Fiat">Fiat</option>
                                    <option value="Ford">Ford</option>
                                    <option value="GWM">GWM</option>
                                    <option value="Honda">Honda</option>
                                    <option value="Hyundai">Hyundai</option>
                                    <option value="Iveco">Iveco</option>
                                    <option value="Jac Motors">Jac Motors</option>
                                    <option value="Jaguar">Jaguar</option>
                                    <option value="Jeep">Jeep</option>
                                    <option value="Kia">Kia</option>
                                    <option value="Lamborghini">Lamborghini</option>
                                    <option value="Land Rover">Land Rover</option>
                                    <option value="Lexus">Lexus</option>
                                    <option value="Lifan">Lifan</option>
                                    <option value="Maserati">Maserati</option>
                                    <option value="McLaren">McLaren</option>
                                    <option value="Mercedes-Benz">Mercedes-Benz</option>
                                    <option value="Mini">Mini</option>
                                    <option value="Mitsubishi">Mitsubishi</option>
                                    <option value="Nissan">Nissan</option>
                                    <option value="Peugeot">Peugeot</option>
                                    <option value="Porsche">Porsche</option>
                                    <option value="RAM">RAM</option>
                                    <option value="Renault">Renault</option>
                                    <option value="Rolls-Royce">Rolls-Royce</option>
                                    <option value="Subaru">Subaru</option>
                                    <option value="Suzuki">Suzuki</option>
                                    <option value="Toyota">Toyota</option>
                                    <option value="Troller">Troller</option>
                                    <option value="Volkswagen">Volkswagen</option>
                                    <option value="Volvo">Volvo</option>
                                </select>
                    </div>
                    <div class="grupo-input">
                        <label>Modelo</label>
                        <input type="text" placeholder="Ex: CBR 600RR" required>
                    </div>

                    <div class="grupo-input">
                        <label>Placa</label>
                        <input type="text" placeholder="Ex: ABC-1234" required>
                    </div>

                    <div class="grupo-input">
                        <label>Ano</label>
                        <input type="text" placeholder="Ex: 2024" required>
                    </div>

                    <div class="grupo-input">
                        <label>Cor</label>
                        <input type="text" placeholder="Ex: Prata" required>
                    </div>

                    <div class="grupo-input">
                        <label>Proprietário</label>
                        <select required>
                            <option value="" disabled selected>Selecione um cliente</option>
                            <option value="1">Marcos Silva</option>
                            <option value="2">José Costa</option>
                        </select>
                    </div>
                    
                    <div class="botoes-acao">
                        <button type="submit" class="btn-salvar">Salvar Veículo</button>
                        <a href="cadastroveiculo.html" class="btn-voltar">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

</body>
</html>

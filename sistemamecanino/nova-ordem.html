<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Repair - Nova Ordem</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/ordens.css">
    <link rel="stylesheet" href="css/nova-ordem.css">
</head>
<body>

    <header class="top-header">
        <button class="hamburger-btn">
            <span></span><span></span><span></span>
        </button>
        <div class="header-logo-text">AUTO REPAIR</div>
    </header>

    <aside class="sidebar" id="sidebar">
        <div class="profile-area">
            <img src="img/download.png" alt="Avatar" class="avatar"> 
            <div class="mobile-profile-text">
                AUTO REPAIR<br>
                <span class="role-text">ADMINISTRADOR</span>
            </div>
        </div>
        <ul class="nav-links">
            <li><a href="admin.html">Painel de Gestão</a></li>
            <li><a href="cadastrocliente.html">Cadastro Cliente</a></li>
            <li><a href="cadastroveiculo.html">Cadastro Veículo</a></li>
            <li><a href="ordens.html" class="active">Ordens de Serviços</a></li>
            <li><a href="estoque-critico.html">Estoque de Peças</a></li>
            <li><a href="historico-veiculos.html">Histórico de Veículos</a></li>
            <li><a href="#">Financeiro</a></li>
            <li><a href="#">Relatórios</a></li>
            <li><a style="cursor:pointer;">👤 Minha Conta</a></li>
            <li><a href="index.html" class="logout-link">Sair</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="orders-container">
            <div class="titulo-sessao">
                <h2>NOVA ORDEM <span class="highlight">DE SERVIÇO</span></h2>
                <div class="linha-decorativa"></div>
            </div>
    
            <div class="caixa-nova-ordem">
                <form action="ordens.html" class="form-nova-ordem">
                    
                    <div class="form-header-grid">
                        <div class="grupo-input">
                            <label>CLIENTE:</label>
                            <input type="text" placeholder="Nome do Cliente">
                        </div>
                        <div class="grupo-input">
                            <label>VEÍCULO:</label>
                            <input type="text" placeholder="Ex: CBR 600RR">
                        </div>
                        <div class="grupo-input">
                            <label>PLACA:</label>
                            <input type="text" placeholder="ABC-1234">
                        </div>
                    </div>
            
                    <div class="form-mid-grid">
                        <div class="grupo-input">
                            <label>PROBLEMA:</label>
                            <textarea rows="6" placeholder="Descreva o problema..."></textarea>
                        </div>
                        <div class="grupo-input">
                            <label>SERVIÇOS:</label>
                            <textarea rows="6" placeholder="Serviços a realizar..."></textarea>
                        </div>
                    </div>
            
                    <div class="form-footer-grid">
                        <div class="grupo-input">
                            <label>PEÇAS USADAS:</label>
                            <textarea rows="5" placeholder="Lista de peças..."></textarea>
                        </div>
                        <div class="financeiro-col">
                            <div class="grupo-input">
                                <label>VALOR TOTAL:</label>
                                <input type="text" class="valor-total" placeholder="R$ 0,00">
                            </div>
                            <div class="grupo-input">
                                <label>STATUS:</label>
                                <select>
                                    <option value="ativo">Ativo</option>
                                    <option value="finalizado">Finalizado</option>
                                    <option value="parado">Parado</option>
                                </select>
                            </div>
                        </div>
                    </div>
            
                    <div class="botoes-acao">
                        <button type="submit" class="btn-salvar">SALVAR ALTERAÇÕES</button>
                        <a href="ordens.html" class="btn-voltar">CANCELAR</a>
                    </div>
                </form>
            </div>
        <div>
    </main>
    <script>
        const btnMobile = document.querySelector('.hamburger-btn');
        const sidebar = document.querySelector('#sidebar');

        // Abre e fecha o menu lateral
        btnMobile.addEventListener('click', () => {
            sidebar.classList.toggle('open');
        });

        // Fecha o menu ao clicar em um link (essencial para mobile)
        const links = document.querySelectorAll('.nav-links a');
        links.forEach(link => {
            link.addEventListener('click', () => {
                sidebar.classList.remove('open');
            });
        });

        // Lógica do Modal de Conta
        const linkConta = document.querySelector('a[style*="cursor:pointer"]'); 
        const modal = document.querySelector('#modal-conta');
        const btnFechar = document.querySelector('.btn-fechar-modal');
        const btnX = document.querySelector('.close-btn');

        if(linkConta) {
            linkConta.addEventListener('click', (e) => {
                e.preventDefault();
                modal.style.display = 'flex';
            });
        }

        [btnFechar, btnX].forEach(btn => {
            if(btn) {
                btn.addEventListener('click', () => {
                    modal.style.display = 'none';
                });
            }
        });

        // Fecha o modal se clicar fora dele
        window.addEventListener('click', (e) => {
            if (e.target == modal) {
                modal.style.display = 'none';
            }
        });
    </script>
</body> </html>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Repair - Editar Profissional</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/ordens.css">
    <link rel="stylesheet" href="../css/nova-ordem.css">
    <style>
        .form-edit-container {
            max-width: 600px;
            margin: 0 auto;
            background: #1c1c1e;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #2c2c2e;
        }
        .form-group-custom {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-group-custom label {
            color: #8e8e93;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .form-group-custom input, .form-group-custom select {
            background-color: #121212;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group-custom input:focus, .form-group-custom select:focus {
            border-color: #ff0000;
        }
    </style>
</head>
<body>

    <header class="top-header">
        <button class="hamburger-btn">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="header-logo-text">AUTO REPAIR</div>
    </header>

    <aside class="sidebar" id="sidebar">
        <div class="profile-area">
            <img src="../img/download.png" alt="Avatar" class="avatar"> 
            <div class="mobile-profile-text">
                AUTO REPAIR<br>
                <span class="role-text">ADMINISTRADOR</span>
            </div>
        </div>

        <ul class="nav-links">
            <li><a href="../admin.html">Painel de Gestão</a></li>
            <li><a href="lista.html" class="active">Gerenciar Usuários</a></li>
            <li><a href="../cadastrocliente.html">Cadastro Cliente</a></li>
            <li><a href="../cadastroveiculo.html">Cadastro Veículo</a></li>
            <li><a href="../ordens.html">Ordens de Serviços</a></li>
            <li><a href="../estoque-critico.html">Estoque de Peças</a></li>
            <li><a href="../historico-veiculos.html">Histórico de Veículos</a></li>
            <li><a href="../financeiro.html">Financeiro</a></li>
            <li><a href="../relatorios.html">Relatórios</a></li>
            <li><a href="../minha-conta.html">Minha Conta</a></li>
            <li><a href="../index.html" class="logout-link">Sair</a></li>
        </ul>
    </aside>

    <main class="main-content" id="main-content">
        <div class="orders-container">
            <div class="os-header-detalhe">
                <h2>EDITAR <span class="text-red">PROFISSIONAL</span></h2>
            </div>

            <div class="form-edit-container">
                <form action="lista.html" method="GET">
                    <div class="form-group-custom">
                        <label for="nome_completo">Nome Completo</label>
                        <input type="text" id="nome_completo" name="nome_completo" value="Clenio Spider" required>
                    </div>

                    <div class="form-group-custom">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" value="clenio@gmail.com" required>
                    </div>

                    <div class="form-group-custom">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" name="telefone" value="(11) 98888-8888">
                    </div>

                    <div class="form-group-custom">
                        <label for="perfil">Cargo / Perfil</label>
                        <select id="perfil" name="perfil">
                            <option value="admin">ADMIN</option>
                            <option value="recep">RECEPCIONISTA</option>
                            <option value="mecan" selected>MECÂNICO</option>
                        </select>
                    </div>

                    <div class="botoes-acao" style="margin-top: 25px;">
                        <button type="submit" class="btn-os btn-salvar-red" style="width: 48%;">SALVAR</button>
                        <a href="lista.html" class="btn-os btn-voltar-dark" style="width: 48%; display: inline-flex; align-items: center; justify-content: center; text-decoration: none;">CANCELAR</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
        const btnMobile = document.querySelector('.hamburger-btn');
        const sidebar = document.querySelector('#sidebar');
    
        btnMobile.addEventListener('click', () => {
            sidebar.classList.toggle('open');
        });
    
        const links = document.querySelectorAll('.nav-links a');
        links.forEach(link => {
            link.addEventListener('click', () => {
                sidebar.classList.remove('open');
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Repair - Novo Cliente</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/novo-cliente.css">
</head>
<body>

    <header class="top-header">
        <button class="hamburger-btn">
            <span></span><span></span><span></span>
        </button>
        <div class="header-logo-text">AUTO REPAIR</div>
    </header>

    <aside class="sidebar" id="sidebar">
        <div class="profile-area">
            <img src="img/download.png" alt="Avatar" class="avatar"> 
            <div class="mobile-profile-text">
                AUTO REPAIR<br>
                <span class="role-text">ADMINISTRADOR</span>
            </div>
        </div>
        <ul class="nav-links">
            <li><a href="admin.html">Painel de Gestão</a></li>
            <li><a href="cadastrocliente.html" class="active">Cadastro Cliente</a></li>
            <li><a href="cadastroveiculo.html">Cadastro Veículo</a></li>
            <li><a href="ordens.html">Ordens de Serviços</a></li>
            <li><a href="estoque-critico.html">Estoque de Peças</a></li>
            <li><a href="historico-veiculos.html">Histórico de Veículos</a></li>
            <li><a href="#">Financeiro</a></li>
            <li><a href="#">Relatórios</a></li>
            <li><a style="cursor:pointer;">👤 Minha Conta</a></li>
            <li><a href="index.html" class="logout-link">Sair</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="container-form-dark">
            <h2 class="titulo-sessao">CADASTRAR NOVO CLIENTE </span></h2>
            
            <div class="card-dark">
                <form action="cadastrocliente.html" method="POST">
                    
                    <div class="form-row">
                        <div class="grupo-input-dark flex-3">
                            <label>NOME COMPLETO</label>
                            <input type="text" placeholder="Ex: João Silva" required>
                        </div>
                        <div class="grupo-input-dark flex-1">
                            <label>CPF / CNPJ</label>
                            <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="18" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="grupo-input-dark flex-1">
                            <label>TELEFONE / WHATSAPP</label>
                            <input type="text" id="telefone" placeholder="(00) 00000-0000" maxlength="15" required>
                        </div>
                        <div class="grupo-input-dark flex-2">
                            <label>E-MAIL</label>
                            <input type="email" placeholder="cliente@email.com">
                        </div>
                    </div>

                    <div class="footer-acoes">
                        <button type="submit" class="btn-acao btn-salvar-os">SALVAR CADASTRO</button>
                        <a href="cadastrocliente.html" class="btn-acao btn-voltar-os">VOLTAR</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
        // Mantive seus scripts de máscara aqui...
        const inputCpf = document.getElementById('cpf');
        const inputTelefone = document.getElementById('telefone');

        inputCpf.addEventListener('input', () => {
            let valor = inputCpf.value.replace(/\D/g, ''); 
            if (valor.length <= 11) {
                valor = valor.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            } else {
                valor = valor.substring(0, 14).replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d)/, '$1-$2');
            }
            inputCpf.value = valor;
        });

        inputTelefone.addEventListener('input', () => {
            let valor = inputTelefone.value.replace(/\D/g, '');
            valor = valor.replace(/^(\d{2})(\d)/g, '($1) $2');
            if (valor.length > 13) valor = valor.replace(/(\d{5})(\d)/, '$1-$2');
            else valor = valor.replace(/(\d{4})(\d)/, '$1-$2');
            inputTelefone.value = valor;
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Repair - Editar Cliente</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/ordens.css">
    <link rel="stylesheet" href="css/cadastro_estilo.css">
</head>
<body>

    <header class="top-header">
        <button class="hamburger-btn">
            <span></span><span></span><span></span>
        </button>
        <div class="header-logo-text">AUTO REPAIR</div>
    </header>

    <aside class="sidebar" id="sidebar">
        <div class="profile-area">
            <img src="img/download.png" alt="Avatar" class="avatar"> 
            <div class="mobile-profile-text">
                AUTO REPAIR<br>
                <span class="role-text">ADMINISTRADOR</span>
            </div>
        </div>
        <ul class="nav-links">
            <li><a href="admin.html">Painel de Gestão</a></li>
            <li><a href="ordens.html">Ordens de Serviços</a></li>
            <li><a href="cadastroveiculo.html">Cadastro Veículo</a></li>
            <li><a href="cadastrocliente.html" class="active">Cadastro Cliente</a></li>
            <li><a href="estoque-critico.html">Estoque de Peças</a></li>
            <li><a href="#">Histórico de Veículos</a></li>
            <li><a href="#">Financeiro</a></li>
            <li><a href="#">Relatórios</a></li>
            <li><a style="cursor:pointer;">👤 Minha Conta</a></li>
            <li><a href="index.html" class="logout-link">Sair</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="orders-container">
            <div class="orders-header">
                <h2>Editar Cadastro de Cliente</h2>
            </div>

            <div class="caixa-formulario">
                <form action="cadastrocliente.html" class="form-estilizado" method="POST">
                    
                    <div class="grupo-input">
                        <label>Nome Completo</label>
                        <input type="text" value="Marcos Silva" required>
                    </div>

                    <div class="grupo-input">
                        <label>CPF / CNPJ</label>
                        <input type="text" value="123.456.789-00" required>
                    </div>

                    <div class="grupo-input">
                        <label>Telefone / WhatsApp</label>
                        <input type="text" value="(11) 98888-7777" required>
                    </div>

                    <div class="grupo-input">
                        <label>E-mail</label>
                        <input type="email" value="marcos@email.com">
                    </div>
                    
                    <div class="botoes-acao">
                        <button type="submit" class="btn-salvar">Atualizar Cadastro</button>
                        <a href="cadastrocliente.html" class="btn-voltar">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Repair - Editar Cliente</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/editar_cliente.css">
</head>
<body class="dark-theme">

    <header class="top-header">
        <button class="hamburger-btn">
            <span></span><span></span><span></span>
        </button>
        <div class="header-logo-text">AUTO REPAIR</div>
    </header>

    <aside class="sidebar" id="sidebar">
        <div class="profile-area">
            <img src="img/download.png" alt="Avatar" class="avatar"> 
            <div class="mobile-profile-text">
                AUTO REPAIR<br>
                <span class="role-text">ADMINISTRADOR</span>
            </div>
        </div>
        <ul class="nav-links">
            <li><a href="admin.html">Painel de Gestão</a></li>
            <li><a href="cadastrocliente.html" class="active">Cadastro Cliente</a></li>
            <li><a href="cadastroveiculo.html">Cadastro Veículo</a></li>
            <li><a href="ordens.html">Ordens de Serviços</a></li>
            <li><a href="estoque-critico.html">Estoque de Peças</a></li>
            <li><a href="historico-veiculos.html">Histórico de Veículos</a></li>
            <li><a href="#">Financeiro</a></li>
            <li><a href="#">Relatórios</a></li>
            <li><a style="cursor:pointer;">👤 Minha Conta</a></li>
            <li><a href="index.html" class="logout-link">Sair</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="container-os">
            
            <h2 class="titulo-os">EDITAR CADASTRO <span class="n-os">DE CLIENTE</span></h2>

            <div class="caixa-gerenciar">
                <form class="form-os" action="cadastrocliente.html" method="POST">
                    
                    <div class="campo-grupo">
                        <label>Nome Completo:</label>
                        <input type="text" value="Marcos Silva" required>
                    </div>

                    <div class="campo-grupo">
                        <label>CPF / CNPJ:</label>
                        <input type="text" id="cpf_cnpj" value="123.456.789-00" required maxlength="18">
                    </div>

                    <div class="linha-dupla">
                        <div class="campo-grupo">
                            <label>Telefone / WhatsApp:</label>
                            <input type="text" id="telefone" value="(11) 98888-7777" required maxlength="15">
                        </div>

                        <div class="campo-grupo">
                            <label>E-mail:</label>
                            <input type="email" value="marcos@email.com">
                        </div>
                    </div>

                    <div class="botoes-os">
                        <button type="submit" class="btn-finalizar-os">ATUALIZAR CADASTRO</button>
                        <a href="cadastrocliente.html" class="btn-voltar-os">CANCELAR</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
        // Máscara de Telefone ( (11) 99999-9999 )
        const handlePhone = (event) => {
            let input = event.target;
            input.value = phoneMask(input.value);
        }

        const phoneMask = (value) => {
            if (!value) return "";
            value = value.replace(/\D/g, '');
            value = value.replace(/(\d{2})(\d)/, "($1) $2");
            value = value.replace(/(\d)(\d{4})$/, "$1-$2");
            return value;
        }

        // Máscara de CPF / CNPJ
        const handleCpfCnpj = (event) => {
            let input = event.target;
            let value = input.value.replace(/\D/g, '');
            
            if (value.length <= 11) {
                // CPF: 000.000.000-00
                value = value.replace(/(\d{3})(\d)/, "$1.$2");
                value = value.replace(/(\d{3})(\d)/, "$1.$2");
                value = value.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
            } else {
                // CNPJ: 00.000.000/0000-00
                value = value.replace(/^(\d{2})(\d)/, "$1.$2");
                value = value.replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3");
                value = value.replace(/\.(\d{3})(\d)/, ".$1/$2");
                value = value.replace(/(\d{4})(\d)/, "$1-$2");
            }
            input.value = value;
        }

        // Aplicando os eventos nos inputs
        document.getElementById('telefone').addEventListener('keyup', handlePhone);
        document.getElementById('cpf_cnpj').addEventListener('keyup', handleCpfCnpj);
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operadores em JavaScript</title>
</head>
<body>

    <h1>Operações com JavaScript</h1>

    <script>
        let a = 15;
        let b = 8;

        let soma = a + b;
        let subtracao = a - b;
        let multiplicacao = a * b;
        let divisao = a / b;

        document.write("<h2>Resultados das Operações</h2>");
        document.write("Soma: " + soma + "<br>");
        document.write("Subtração: " + subtracao + "<br>");
        document.write("Multiplicação: " + multiplicacao + "<br>");
        document.write("Divisão: " + divisao + "<br><br>");

        document.write("<h2>Comparações</h2>");
        document.write("A é maior que B? " + (a > b) + "<br>");
        document.write("B é maior que A? " + (b > a) + "<br>");
        document.write("A é igual a B? " + (a == b) + "<br><br>");

        a++;
        b--;

        document.write("<h2>Incremento e Decremento</h2>");
        document.write("Novo valor de A: " + a + "<br>");
        document.write("Novo valor de B: " + b + "<br>");
    </script>

</body>
</html>
